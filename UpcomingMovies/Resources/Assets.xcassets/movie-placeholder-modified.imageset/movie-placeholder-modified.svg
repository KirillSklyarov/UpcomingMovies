<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E44AD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C3E50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#grad3)"/>
  
  <!-- Декоративная рамка -->
  <rect x="20" y="20" width="260" height="410" rx="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Иконка фильма сверху -->
  <rect x="125" y="50" width="50" height="40" rx="5" fill="none" stroke="white" stroke-width="2"/>
  <polygon points="135,60 135,80 155,70" fill="white"/>
  
  <!-- Декоративные элементы -->
  <rect x="40" y="110" width="220" height="1" fill="white" opacity="0.7"/>
  <rect x="40" y="340" width="220" height="1" fill="white" opacity="0.7"/>
  
  <!-- Текст внизу -->
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">ИЗОБРАЖЕНИЕ</text>
  <text x="150" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">ОТСУТСТВУЕТ</text>
</svg>
